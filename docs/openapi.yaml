openapi: 3.1.1
info:
  title: PaleoAPI
  version: 1.0.0
  license: { name: See LICENSE in the repository }
  # Decimals bullet: spec §4.13 (places, trailing zeros, normalized output, 10^15 / 40-character bound).
  description: |
    Public REST API with data about prehistoric species, geologic time, taxonomy, and geography.

    - **Reads** (`GET`) are public. Every response allows any origin (`Access-Control-Allow-Origin: *`) and exposes `ETag`.
      `OPTIONS` preflight requests succeed on every path and allow `GET`, `POST`, `PATCH`, `DELETE` and the
      `Authorization`, `Content-Type`, `If-None-Match` headers; credentials are never allowed.
    - **Caching:** successful `GET` responses carry `ETag` and `Cache-Control: public, max-age=300`. Send `If-None-Match`
      to get `304 Not Modified`. Error responses to `GET` carry `Cache-Control: no-store`.
    - **Writes** (`POST`, `PATCH`, `DELETE`) require an admin token from `POST /auth/login`, sent as
      `Authorization: Bearer <token>`. Tokens last 60 minutes. Reads ignore the `Authorization` header.
    - **Write bodies** are `application/json` objects of at most 64 KB. Unknown fields are rejected. `PATCH` changes only
      the fields sent; `null` clears an optional field; list and `size` values replace the stored value.
    - **When several problems apply**, the first of these wins: 408/414/431 request limits; 503 busy; 429 rate limit;
      404 unknown route / 405 method; 401/403; 413/415/400 body;
      404 unknown resource in the path; 422 validation (all problems listed in `details`); 409 conflict.
    - **Rate limits:** 600 requests per minute per client with bursts up to 120 (operator-configurable). Every response
      carries `RateLimit` and `RateLimit-Policy` (draft-ietf-httpapi-ratelimit-headers-11); `429` and `503` carry
      `Retry-After` in seconds; all three are readable by browser scripts.
    - **Limits:** URL at most 2048 characters (414), request headers at most 16 KB (431), headers within 10 seconds and
      body within 30 seconds (408).
    - **Lists:** `page` (1–1,000,000, default 1), `limit` (1–100, default 20), `sort=<field>` or `sort=-<field>`; ties are
      ordered by `id`. Filters combine with AND. Repeating a known parameter returns 400; unknown parameters are ignored.
    - **Ids** are slugs chosen on create (2–64 of `a-z`, `0-9`, single inner hyphens) and never change. A path id that is
      not a slug returns the resource's 404.
    - **Decimals** are JSON numbers, never rounded: more decimal places than allowed returns 422. Trailing zeros are not
      significant and are not stored (`66.0` is returned as `66`). The absolute value must be below 10^15 and the
      number text at most 40 characters; otherwise 422.
    - Unsupported methods return `405 METHOD_NOT_ALLOWED` with an `Allow` header.
servers:
  - url: /api/v1
tags:
  - { name: auth, description: Admin login. }
  - { name: geologic-time, description: Eras and periods. }
  - { name: taxonomy, description: 'Domain → kingdom → phylum → class → order → family → genus.' }
  - { name: geography, description: Continents and countries. }
  - { name: species }

paths:
  # ---------------------------------------------------------------- auth
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      description: 'Exchanges an admin username and password for a 60-minute token. Limited to 10 attempts per client and 20 failures per username per 15 minutes (operator-configurable).'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/LoginOk' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/InvalidCredentials' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationFailed' }, '500': { $ref: '#/components/responses/InternalError' }, '408': { $ref: '#/components/responses/RequestTimeout' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }

  # ---------------------------------------------------------------- geologic time
  /eras:
    get:
      operationId: listEras
      tags: [geologic-time]
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/sortTime' }, { $ref: '#/components/parameters/IfNoneMatch' }]
      responses: { '200': { $ref: '#/components/responses/EraPage' }, '304': { $ref: '#/components/responses/NotModified' }, '400': { $ref: '#/components/responses/BadRequest' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
    post:
      operationId: createEra
      tags: [geologic-time]
      security: [{ adminBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EraCreate' } } } }
      responses: { '201': { description: Created., headers: { Location: { $ref: '#/components/headers/Location' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EraEnvelope' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationFailed' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '408': { $ref: '#/components/responses/RequestTimeout' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
  /eras/{era_id}:
    parameters: [{ $ref: '#/components/parameters/era_id' }]
    get:
      operationId: getEra
      tags: [geologic-time]
      parameters: [{ $ref: '#/components/parameters/IfNoneMatch' }]
      responses: { '200': { $ref: '#/components/responses/EraOne' }, '304': { $ref: '#/components/responses/NotModified' }, '404': { $ref: '#/components/responses/NotFound' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
    patch:
      operationId: updateEra
      tags: [geologic-time]
      security: [{ adminBearer: [] }]
      description: The resulting range must not overlap another era and must still contain all of the era's periods.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EraPatch' } } } }
      responses: { '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/EraEnvelope' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationFailed' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '408': { $ref: '#/components/responses/RequestTimeout' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
    delete:
      operationId: deleteEra
      tags: [geologic-time]
      security: [{ adminBearer: [] }]
      description: 409 ERA_HAS_DEPENDENTS while the era has periods.
      responses: { '204': { $ref: '#/components/responses/Deleted' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
  /eras/{era_id}/periods:
    parameters: [{ $ref: '#/components/parameters/era_id' }]
    get:
      operationId: listEraPeriods
      tags: [geologic-time]
      description: 404 ERA_NOT_FOUND if the era does not exist.
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/sortTime' }, { $ref: '#/components/parameters/IfNoneMatch' }]
      responses: { '200': { $ref: '#/components/responses/PeriodPage' }, '304': { $ref: '#/components/responses/NotModified' }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
    post:
      operationId: createEraPeriod
      tags: [geologic-time]
      security: [{ adminBearer: [] }]
      description: Creates a period in this era. Sending `era_id` in the body returns 422. `Location` is `/api/v1/periods/{period_id}`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PeriodCreate' } } } }
      responses: { '201': { description: Created., headers: { Location: { $ref: '#/components/headers/Location' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PeriodEnvelope' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationFailed' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '408': { $ref: '#/components/responses/RequestTimeout' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
  /periods:
    get:
      operationId: listPeriods
      tags: [geologic-time]
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/sortTime' }, { $ref: '#/components/parameters/filterEra' }, { $ref: '#/components/parameters/IfNoneMatch' }]
      responses: { '200': { $ref: '#/components/responses/PeriodPage' }, '304': { $ref: '#/components/responses/NotModified' }, '400': { $ref: '#/components/responses/BadRequest' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
  /periods/{period_id}:
    parameters: [{ $ref: '#/components/parameters/period_id' }]
    get:
      operationId: getPeriod
      tags: [geologic-time]
      parameters: [{ $ref: '#/components/parameters/IfNoneMatch' }]
      responses: { '200': { $ref: '#/components/responses/PeriodOne' }, '304': { $ref: '#/components/responses/NotModified' }, '404': { $ref: '#/components/responses/NotFound' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
    patch:
      operationId: updatePeriod
      tags: [geologic-time]
      security: [{ adminBearer: [] }]
      description: May move the period to another era (`era_id`), together with its range. Rules are checked on the result.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PeriodPatch' } } } }
      responses: { '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/PeriodEnvelope' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationFailed' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '408': { $ref: '#/components/responses/RequestTimeout' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
    delete:
      operationId: deletePeriod
      tags: [geologic-time]
      security: [{ adminBearer: [] }]
      description: 409 PERIOD_HAS_DEPENDENTS while any species is linked to the period.
      responses: { '204': { $ref: '#/components/responses/Deleted' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }

  # ---------------------------------------------------------------- taxonomy
  /taxonomy/domains:
    get:
      operationId: listDomains
      tags: [taxonomy]
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/sortName' }, { $ref: '#/components/parameters/IfNoneMatch' }]
      responses: { '200': { $ref: '#/components/responses/DomainPage' }, '304': { $ref: '#/components/responses/NotModified' }, '400': { $ref: '#/components/responses/BadRequest' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
    post:
      operationId: createDomain
      tags: [taxonomy]
      security: [{ adminBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaxonCreate' } } } }
      responses: { '201': { description: Created., headers: { Location: { $ref: '#/components/headers/Location' } }, content: { application/json: { schema: { $ref: '#/components/schemas/DomainEnvelope' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationFailed' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '408': { $ref: '#/components/responses/RequestTimeout' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
  /taxonomy/domains/{domain_id}:
    parameters: [{ $ref: '#/components/parameters/domain_id' }]
    get:
      operationId: getDomain
      tags: [taxonomy]
      parameters: [{ $ref: '#/components/parameters/IfNoneMatch' }]
      responses: { '200': { $ref: '#/components/responses/DomainOne' }, '304': { $ref: '#/components/responses/NotModified' }, '404': { $ref: '#/components/responses/NotFound' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
    patch:
      operationId: updateDomain
      tags: [taxonomy]
      security: [{ adminBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DomainPatch' } } } }
      responses: { '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/DomainEnvelope' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationFailed' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '408': { $ref: '#/components/responses/RequestTimeout' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
    delete:
      operationId: deleteDomain
      tags: [taxonomy]
      security: [{ adminBearer: [] }]
      description: 409 DOMAIN_HAS_DEPENDENTS while the domain has kingdoms.
      responses: { '204': { $ref: '#/components/responses/Deleted' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
  /taxonomy/domains/{domain_id}/kingdoms:
    parameters: [{ $ref: '#/components/parameters/domain_id' }]
    get:
      operationId: listDomainKingdoms
      tags: [taxonomy]
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/sortName' }, { $ref: '#/components/parameters/IfNoneMatch' }]
      responses: { '200': { $ref: '#/components/responses/KingdomPage' }, '304': { $ref: '#/components/responses/NotModified' }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
    post:
      operationId: createDomainKingdom
      tags: [taxonomy]
      security: [{ adminBearer: [] }]
      description: Sending `domain_id` in the body returns 422. `Location` is `/api/v1/taxonomy/kingdoms/{kingdom_id}`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaxonCreate' } } } }
      responses: { '201': { description: Created., headers: { Location: { $ref: '#/components/headers/Location' } }, content: { application/json: { schema: { $ref: '#/components/schemas/KingdomEnvelope' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationFailed' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '408': { $ref: '#/components/responses/RequestTimeout' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
  /taxonomy/kingdoms:
    get:
      operationId: listKingdoms
      tags: [taxonomy]
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/sortName' }, { $ref: '#/components/parameters/filterDomain' }, { $ref: '#/components/parameters/IfNoneMatch' }]
      responses: { '200': { $ref: '#/components/responses/KingdomPage' }, '304': { $ref: '#/components/responses/NotModified' }, '400': { $ref: '#/components/responses/BadRequest' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
  /taxonomy/kingdoms/{kingdom_id}:
    parameters: [{ $ref: '#/components/parameters/kingdom_id' }]
    get:
      operationId: getKingdom
      tags: [taxonomy]
      parameters: [{ $ref: '#/components/parameters/IfNoneMatch' }]
      responses: { '200': { $ref: '#/components/responses/KingdomOne' }, '304': { $ref: '#/components/responses/NotModified' }, '404': { $ref: '#/components/responses/NotFound' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
    patch:
      operationId: updateKingdom
      tags: [taxonomy]
      security: [{ adminBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KingdomPatch' } } } }
      responses: { '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/KingdomEnvelope' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationFailed' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '408': { $ref: '#/components/responses/RequestTimeout' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
    delete:
      operationId: deleteKingdom
      tags: [taxonomy]
      security: [{ adminBearer: [] }]
      description: 409 KINGDOM_HAS_DEPENDENTS while the kingdom has phyla.
      responses: { '204': { $ref: '#/components/responses/Deleted' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
  /taxonomy/kingdoms/{kingdom_id}/phyla:
    parameters: [{ $ref: '#/components/parameters/kingdom_id' }]
    get:
      operationId: listKingdomPhyla
      tags: [taxonomy]
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/sortName' }, { $ref: '#/components/parameters/IfNoneMatch' }]
      responses: { '200': { $ref: '#/components/responses/PhylumPage' }, '304': { $ref: '#/components/responses/NotModified' }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
    post:
      operationId: createKingdomPhylum
      tags: [taxonomy]
      security: [{ adminBearer: [] }]
