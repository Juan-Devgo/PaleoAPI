    patch:
      operationId: updateSpecies
      tags: [species]
      security: [{ adminBearer: [] }]
      description: List fields and `size` replace the stored value. `period_ids` must keep at least one item.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SpeciesPatch' } } } }
      responses: { '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/SpeciesEnvelope' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationFailed' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '408': { $ref: '#/components/responses/RequestTimeout' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
    delete:
      operationId: deleteSpecies
      tags: [species]
      security: [{ adminBearer: [] }]
      description: Always allowed; removes the species with its size and links.
      responses: { '204': { $ref: '#/components/responses/Deleted' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '405': { $ref: '#/components/responses/MethodNotAllowed' }, '500': { $ref: '#/components/responses/InternalError' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }

components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token from POST /auth/login, valid 60 minutes, sent only in the Authorization header (query, cookie, and body are ignored). The account must be active; writes also need the admin role.'

  parameters:
    page: { name: page, in: query, description: '1-based page number. Past the last page returns empty `data`.', schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    sortName: { name: sort, in: query, description: Case-insensitive. Ties are ordered by `id`., schema: { type: string, enum: [name, -name], default: name } }
    sortTime: { name: sort, in: query, description: '`-start_mya` lists the oldest first. Ties are ordered by `id`.', schema: { type: string, enum: [start_mya, -start_mya, name, -name], default: -start_mya } }
    sortSpecies: { name: sort, in: query, description: Species without `discovery_year` sort last in both directions. Ties are ordered by `id`., schema: { type: string, enum: [name, -name, scientific_name, -scientific_name, discovery_year, -discovery_year], default: name } }
    IfNoneMatch: { name: If-None-Match, in: header, description: An `ETag` from a previous response; returns 304 when unchanged., schema: { type: string }, example: '"9f2c4a1be07d3c55"' }
    filterEra: { name: era, in: query, schema: { $ref: '#/components/schemas/Slug' } }
    filterDomain: { name: domain, in: query, schema: { $ref: '#/components/schemas/Slug' } }
    filterKingdom: { name: kingdom, in: query, schema: { $ref: '#/components/schemas/Slug' } }
    filterPhylum: { name: phylum, in: query, schema: { $ref: '#/components/schemas/Slug' } }
    filterClass: { name: class, in: query, schema: { $ref: '#/components/schemas/Slug' } }
    filterOrder: { name: order, in: query, schema: { $ref: '#/components/schemas/Slug' } }
    filterFamily: { name: family, in: query, schema: { $ref: '#/components/schemas/Slug' } }
    filterContinent: { name: continent, in: query, schema: { $ref: '#/components/schemas/Slug' } }
    filterType: { name: type, in: query, schema: { $ref: '#/components/schemas/ContinentType' } }
    era_id: { name: era_id, in: path, required: true, schema: { type: string }, example: mesozoic }
    period_id: { name: period_id, in: path, required: true, schema: { type: string }, example: cretaceous }
    domain_id: { name: domain_id, in: path, required: true, schema: { type: string }, example: eukaryota }
    kingdom_id: { name: kingdom_id, in: path, required: true, schema: { type: string }, example: animalia }
    phylum_id: { name: phylum_id, in: path, required: true, schema: { type: string }, example: chordata }
    class_id: { name: class_id, in: path, required: true, schema: { type: string }, example: reptilia }
    order_id: { name: order_id, in: path, required: true, schema: { type: string }, example: saurischia }
    family_id: { name: family_id, in: path, required: true, schema: { type: string }, example: tyrannosauridae }
    genus_id: { name: genus_id, in: path, required: true, schema: { type: string }, example: tyrannosaurus }
    continent_id: { name: continent_id, in: path, required: true, schema: { type: string }, example: north-america }
    country_id: { name: country_id, in: path, required: true, schema: { type: string }, example: usa }
    species_id: { name: species_id, in: path, required: true, schema: { type: string }, example: tyrannosaurus-rex }

  headers:
    ETag: { description: Changes whenever the representation changes., schema: { type: string }, example: '"9f2c4a1be07d3c55"' }
    CacheControl: { schema: { type: string, const: 'public, max-age=300' } }
    Location: { description: Canonical path of the created resource., schema: { type: string }, example: /api/v1/species/tyrannosaurus-rex }
    Allow: { description: Methods supported on the path., schema: { type: string }, example: 'GET, PATCH, DELETE' }
    WWWAuthenticate: { schema: { type: string }, examples: { missing: { value: 'Bearer realm="paleo-api"' }, rejected: { value: 'Bearer realm="paleo-api", error="invalid_token"' } } }
    CacheControlNoStore: { schema: { type: string, const: no-store } }
    RateLimit: { description: 'Remaining requests `r` and seconds `t` until the limit fully resets.', schema: { type: string }, example: '"general";r=117;t=1' }
    RateLimitPolicy: { description: 'The limit: `q` requests per `w` seconds (the burst bucket).', schema: { type: string }, example: '"general";q=120;w=12' }
    RetryAfter: { description: Seconds to wait before retrying (always at least 1)., schema: { type: integer, minimum: 1 }, example: 3 }

  responses:
    NotModified:
      description: The representation matches `If-None-Match`. No body.
      headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
    Deleted: { description: Deleted. No body. }
    BadRequest:
      description: Malformed JSON body, or an invalid query parameter (type, range, empty, repeated, unknown sort field, invalid filter value).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            query: { value: { error: { code: INVALID_QUERY_PARAMETER, message: "sort 'size' is not supported. Use one of: name, -name, scientific_name, -scientific_name, discovery_year, -discovery_year." } } }
            json: { value: { error: { code: INVALID_JSON, message: 'The request body is not valid JSON (line 1, column 14). Check quotes, commas, and brackets.' } } }
    Unauthorized:
      description: Missing, expired, or invalid token.
      headers: { WWW-Authenticate: { $ref: '#/components/headers/WWWAuthenticate' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            missing: { value: { error: { code: UNAUTHORIZED, message: "This operation needs an admin token. Log in at POST /api/v1/auth/login and send the token as 'Authorization: Bearer <token>'." } } }
            expired: { value: { error: { code: UNAUTHORIZED, message: 'Your token has expired. Log in again at POST /api/v1/auth/login to get a new one.' } } }
            invalid: { value: { error: { code: UNAUTHORIZED, message: 'Your token is not valid. Log in again at POST /api/v1/auth/login to get a new one.' } } }
    Forbidden:
      description: Valid token of an account without the admin role.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: { code: FORBIDDEN, message: 'This operation requires the admin role. Ask an operator to grant it to your account.' } } } }
    LoginOk:
      description: Token issued.
      headers: { Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/LoginEnvelope' } } }
    InvalidCredentials:
      description: Unknown username, wrong password, or disabled account; the three are indistinguishable.
      headers: { WWW-Authenticate: { $ref: '#/components/headers/WWWAuthenticate' }, Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: { code: INVALID_CREDENTIALS, message: 'Wrong username or password.' } } } }
    RequestTimeout:
      description: The body did not arrive within 30 seconds. The connection is closed.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: { code: REQUEST_TIMEOUT, message: 'The request took too long to send: the body must arrive within 30 seconds. Send it again.' } } } }
    UriTooLong:
      description: The request target is longer than 2048 characters. Possible on every path.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: { code: URI_TOO_LONG, message: 'The URL is too long: the limit is 2048 characters. Shorten the query.' } } } }
    HeadersTooLarge:
      description: The request headers exceed 16 KB in total. Possible on every path.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: { code: REQUEST_HEADERS_TOO_LARGE, message: 'The request headers are too large: the limit is 16 KB in total. Remove unneeded headers or cookies.' } } } }
    RateLimited:
      description: A rate limit was exceeded. Requests rejected this way do not extend the wait.
      headers: { Retry-After: { $ref: '#/components/headers/RetryAfter' }, RateLimit: { $ref: '#/components/headers/RateLimit' }, RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            general: { value: { error: { code: RATE_LIMITED, message: 'Too many requests: the limit is 600 requests per minute (bursts up to 120). Retry in 3 seconds.' } } }
            loginClient: { value: { error: { code: RATE_LIMITED, message: 'Too many login attempts from your address: the limit is 10 per 15 minutes. Retry in 412 seconds.' } } }
            loginUsername: { value: { error: { code: RATE_LIMITED, message: 'Too many failed logins for this username: the limit is 20 per 15 minutes. Retry in 412 seconds.' } } }
    ServiceUnavailable:
      description: The API is at capacity or the database is unavailable or too slow. Nothing was changed.
      headers: { Retry-After: { $ref: '#/components/headers/RetryAfter' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            busy: { value: { error: { code: SERVICE_UNAVAILABLE, message: 'The API is busy. Retry in 1 second.' } } }
            database: { value: { error: { code: SERVICE_UNAVAILABLE, message: 'The service is temporarily unavailable. Retry in 5 seconds.' } } }
    NotFound:
      description: '`<RESOURCE>_NOT_FOUND` for an unknown or malformed id in the path (including the parent of a nested path), `ROUTE_NOT_FOUND` for an unknown path.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            resource: { value: { error: { code: SPECIES_NOT_FOUND, message: "No species found with id 'trex01'." } } }
            route: { value: { error: { code: ROUTE_NOT_FOUND, message: "No route matches '/api/v1/specie'. See the API description for available paths." } } }
    MethodNotAllowed:
      description: Sent with a method this path does not support (spec §4.11, AC 6.1.15). The `Allow` header lists the supported methods.
      headers: { Allow: { $ref: '#/components/headers/Allow' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: { code: METHOD_NOT_ALLOWED, message: "PUT is not supported on this path. Use one of: GET, PATCH, DELETE." } } } }
    Conflict:
      description: '`<RESOURCE>_ALREADY_EXISTS` for a duplicate id or name (names compared ignoring case); `<RESOURCE>_HAS_DEPENDENTS` when a delete is blocked.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            exists: { value: { error: { code: ERA_ALREADY_EXISTS, message: "An era named 'Mesozoic' already exists (names are compared ignoring case)." } } }
            dependents: { value: { error: { code: ERA_HAS_DEPENDENTS, message: "Cannot delete era 'mesozoic': 3 periods depend on it (cretaceous, jurassic, triassic). Delete or reassign them first." } } }
    PayloadTooLarge:
      description: Request body larger than 64 KB (65,536 bytes).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: { code: PAYLOAD_TOO_LARGE, message: 'The request body is larger than 64 KB.' } } } }
    UnsupportedMediaType:
      description: The write body is not `application/json`.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: { code: UNSUPPORTED_MEDIA_TYPE, message: 'Send the body as JSON with the header Content-Type: application/json.' } } } }
    ValidationFailed:
      description: Well-formed body that breaks validation or domain rules. `details` lists every problem.
      content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
    InternalError:
      description: Unexpected error. The message is generic.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: { code: INTERNAL_ERROR, message: 'Something went wrong on our side. Try again later.' } } } }
    EraOne: { description: The era., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EraEnvelope' } } } }
    EraPage: { description: A page of eras., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EraPageEnvelope' } } } }
    PeriodOne: { description: The period., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PeriodEnvelope' } } } }
    PeriodPage: { description: A page of periods., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PeriodPageEnvelope' } } } }
    DomainOne: { description: The domain., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/DomainEnvelope' } } } }
    DomainPage: { description: A page of domains., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/DomainPageEnvelope' } } } }
    KingdomOne: { description: The kingdom., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/KingdomEnvelope' } } } }
    KingdomPage: { description: A page of kingdoms., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/KingdomPageEnvelope' } } } }
    PhylumOne: { description: The phylum., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PhylumEnvelope' } } } }
    PhylumPage: { description: A page of phyla., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PhylumPageEnvelope' } } } }
    ClassOne: { description: The class., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ClassEnvelope' } } } }
    ClassPage: { description: A page of classes., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ClassPageEnvelope' } } } }
    OrderOne: { description: The order., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/OrderEnvelope' } } } }
    OrderPage: { description: A page of orders., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/OrderPageEnvelope' } } } }
    FamilyOne: { description: The family., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/FamilyEnvelope' } } } }
    FamilyPage: { description: A page of families., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/FamilyPageEnvelope' } } } }
    GenusOne: { description: The genus., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/GenusEnvelope' } } } }
    GenusPage: { description: A page of genera., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/GenusPageEnvelope' } } } }
    ContinentOne: { description: The continent., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ContinentEnvelope' } } } }
    ContinentPage: { description: A page of continents., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ContinentPageEnvelope' } } } }
    CountryOne: { description: The country., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CountryEnvelope' } } } }
    CountryPage: { description: A page of countries., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CountryPageEnvelope' } } } }
    SpeciesOne: { description: The species card., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/SpeciesEnvelope' } } } }
    SpeciesPage: { description: A page of species cards., headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }, content: { application/json: { schema: { $ref: '#/components/schemas/SpeciesPageEnvelope' } } } }

  schemas:
    # ---- shared
    Slug: { type: string, minLength: 2, maxLength: 64, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', example: tyrannosaurus-rex }
    Name: { type: string, minLength: 1, maxLength: 64, description: Surrounding whitespace is trimmed before validation and storage. }
    Mya: { type: number, minimum: 0, maximum: 4600, description: Millions of years ago; at most 3 decimal places. }
    Summary: { type: object, required: [id, name], properties: { id: { $ref: '#/components/schemas/Slug' }, name: { type: string } } }
    ContinentSummary: { type: object, required: [id, name, type], properties: { id: { $ref: '#/components/schemas/Slug' }, name: { type: string }, type: { $ref: '#/components/schemas/ContinentType' } } }
    Pagination:
      type: object
      required: [page, limit, total_items, total_pages]
      properties: { page: { type: integer }, limit: { type: integer }, total_items: { type: integer }, total_pages: { type: integer, description: 0 when total_items is 0. } }
      example: { page: 1, limit: 20, total_items: 342, total_pages: 18 }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, maxLength: 128, format: password }
    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, const: 3600 }
    LoginEnvelope: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/LoginResponse' } } }
    FieldError: { type: object, required: [field, message], properties: { field: { type: string, description: 'Body field (`size.length_m.min` for nested); `""` for the whole body.' }, message: { type: string } } }
    ValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties: { code: { const: VALIDATION_FAILED }, message: { type: string }, details: { type: array, minItems: 1, items: { $ref: '#/components/schemas/FieldError' } } }
      example:
        error:
          code: VALIDATION_FAILED
          message: The request body has 2 invalid fields.
          details:
            - { field: end_mya, message: 'end_mya (201.4) must be less than start_mya (145).' }
            - { field: id, message: 'id must be 2–64 lowercase letters, digits, or hyphens.' }

    # ---- geologic time
    Era:
      type: object
      required: [id, name, start_mya, end_mya]
      properties: { id: { $ref: '#/components/schemas/Slug' }, name: { type: string }, start_mya: { type: number }, end_mya: { type: number } }
      example: { id: mesozoic, name: Mesozoic, start_mya: 251.902, end_mya: 66 }
    EraCreate:
      type: object
      additionalProperties: false
      required: [id, name, start_mya, end_mya]
      description: '`start_mya > end_mya`; must not overlap another era (touching boundaries allowed).'
      properties: { id: { $ref: '#/components/schemas/Slug' }, name: { $ref: '#/components/schemas/Name' }, start_mya: { $ref: '#/components/schemas/Mya' }, end_mya: { $ref: '#/components/schemas/Mya' } }
    EraPatch: { type: object, additionalProperties: false, minProperties: 1, properties: { name: { $ref: '#/components/schemas/Name' }, start_mya: { $ref: '#/components/schemas/Mya' }, end_mya: { $ref: '#/components/schemas/Mya' } } }
    Period:
      type: object
      required: [id, name, start_mya, end_mya, era]
      properties: { id: { $ref: '#/components/schemas/Slug' }, name: { type: string }, start_mya: { type: number }, end_mya: { type: number }, era: { $ref: '#/components/schemas/Summary' } }
      example: { id: cretaceous, name: Cretaceous, start_mya: 145, end_mya: 66, era: { id: mesozoic, name: Mesozoic } }
    PeriodCreate:
      type: object
      additionalProperties: false
      required: [id, name, start_mya, end_mya]
      description: Lies within the era's range; must not overlap another period.
      properties: { id: { $ref: '#/components/schemas/Slug' }, name: { $ref: '#/components/schemas/Name' }, start_mya: { $ref: '#/components/schemas/Mya' }, end_mya: { $ref: '#/components/schemas/Mya' } }
    PeriodPatch: { type: object, additionalProperties: false, minProperties: 1, properties: { name: { $ref: '#/components/schemas/Name' }, start_mya: { $ref: '#/components/schemas/Mya' }, end_mya: { $ref: '#/components/schemas/Mya' }, era_id: { $ref: '#/components/schemas/Slug' } } }

    # ---- taxonomy
    TaxonCreate: { type: object, additionalProperties: false, required: [id, name], properties: { id: { $ref: '#/components/schemas/Slug' }, name: { $ref: '#/components/schemas/Name' } }, example: { id: animalia, name: Animalia } }
    Domain: { type: object, required: [id, name], properties: { id: { $ref: '#/components/schemas/Slug' }, name: { type: string } }, example: { id: eukaryota, name: Eukaryota } }
    DomainPatch: { type: object, additionalProperties: false, minProperties: 1, properties: { name: { $ref: '#/components/schemas/Name' } } }
    Kingdom: { type: object, required: [id, name, domain], properties: { id: { $ref: '#/components/schemas/Slug' }, name: { type: string }, domain: { $ref: '#/components/schemas/Summary' } }, example: { id: animalia, name: Animalia, domain: { id: eukaryota, name: Eukaryota } } }
    KingdomPatch: { type: object, additionalProperties: false, minProperties: 1, properties: { name: { $ref: '#/components/schemas/Name' }, domain_id: { $ref: '#/components/schemas/Slug' } } }
    Phylum: { type: object, required: [id, name, kingdom], properties: { id: { $ref: '#/components/schemas/Slug' }, name: { type: string }, kingdom: { $ref: '#/components/schemas/Summary' } } }
    PhylumPatch: { type: object, additionalProperties: false, minProperties: 1, properties: { name: { $ref: '#/components/schemas/Name' }, kingdom_id: { $ref: '#/components/schemas/Slug' } } }
    Class: { type: object, required: [id, name, phylum], properties: { id: { $ref: '#/components/schemas/Slug' }, name: { type: string }, phylum: { $ref: '#/components/schemas/Summary' } } }
    ClassPatch: { type: object, additionalProperties: false, minProperties: 1, properties: { name: { $ref: '#/components/schemas/Name' }, phylum_id: { $ref: '#/components/schemas/Slug' } } }
    Order: { type: object, required: [id, name, class], properties: { id: { $ref: '#/components/schemas/Slug' }, name: { type: string }, class: { $ref: '#/components/schemas/Summary' } } }
    OrderPatch: { type: object, additionalProperties: false, minProperties: 1, properties: { name: { $ref: '#/components/schemas/Name' }, class_id: { $ref: '#/components/schemas/Slug' } } }
    Family: { type: object, required: [id, name, order], properties: { id: { $ref: '#/components/schemas/Slug' }, name: { type: string }, order: { $ref: '#/components/schemas/Summary' } } }
    FamilyPatch: { type: object, additionalProperties: false, minProperties: 1, properties: { name: { $ref: '#/components/schemas/Name' }, order_id: { $ref: '#/components/schemas/Slug' } } }
    Genus: { type: object, required: [id, name, family], properties: { id: { $ref: '#/components/schemas/Slug' }, name: { type: string }, family: { $ref: '#/components/schemas/Summary' } }, example: { id: tyrannosaurus, name: Tyrannosaurus, family: { id: tyrannosauridae, name: Tyrannosauridae } } }
    GenusPatch: { type: object, additionalProperties: false, minProperties: 1, properties: { name: { $ref: '#/components/schemas/Name' }, family_id: { $ref: '#/components/schemas/Slug' } } }

    # ---- geography
    ContinentType: { type: string, enum: [prehistoric, modern] }
    Continent: { type: object, required: [id, name, type], properties: { id: { $ref: '#/components/schemas/Slug' }, name: { type: string }, type: { $ref: '#/components/schemas/ContinentType' } }, example: { id: laramidia, name: Laramidia, type: prehistoric } }
    ContinentCreate: { type: object, additionalProperties: false, required: [id, name, type], properties: { id: { $ref: '#/components/schemas/Slug' }, name: { $ref: '#/components/schemas/Name' }, type: { $ref: '#/components/schemas/ContinentType' } } }
    ContinentPatch: { type: object, additionalProperties: false, minProperties: 1, properties: { name: { $ref: '#/components/schemas/Name' }, type: { $ref: '#/components/schemas/ContinentType' } } }
    ContinentIds: { type: array, minItems: 1, maxItems: 10, uniqueItems: true, items: { $ref: '#/components/schemas/Slug' }, description: Modern continents only. }
    Country:
      type: object
      required: [id, name, continents]
      properties: { id: { $ref: '#/components/schemas/Slug' }, name: { type: string }, continents: { type: array, description: Sorted by name., items: { $ref: '#/components/schemas/ContinentSummary' } } }
      example: { id: egypt, name: Egypt, continents: [{ id: africa, name: Africa, type: modern }, { id: asia, name: Asia, type: modern }] }
    CountryCreate: { type: object, additionalProperties: false, required: [id, name, continent_ids], properties: { id: { $ref: '#/components/schemas/Slug' }, name: { $ref: '#/components/schemas/Name' }, continent_ids: { $ref: '#/components/schemas/ContinentIds' } } }
    CountryPatch: { type: object, additionalProperties: false, minProperties: 1, properties: { name: { $ref: '#/components/schemas/Name' }, continent_ids: { $ref: '#/components/schemas/ContinentIds' } } }

    # ---- species
    Diet: { type: string, enum: [carnivore, herbivore, omnivore, piscivore, insectivore] }
    # Range bounds: spec §5.6 (places, min ≤ max) and §4.13 (10^15 / 40-character bound).
    Range:
      type: object
      additionalProperties: false
      required: [min, max]
      description: Both bounds > 0 and below 10^15 (number text at most 40 characters), at most 6 decimal places, min ≤ max.
      properties: { min: { type: number, exclusiveMinimum: 0 }, max: { type: number, exclusiveMinimum: 0 } }
    SizeInput:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 'At least one measure. A measure sent as null is the same as leaving it out. Send `"size": null` to remove all size data.'
      properties: { length_m: { anyOf: [{ $ref: '#/components/schemas/Range' }, { type: 'null' }] }, height_m: { anyOf: [{ $ref: '#/components/schemas/Range' }, { type: 'null' }] }, weight_kg: { anyOf: [{ $ref: '#/components/schemas/Range' }, { type: 'null' }] } }
    Size:
      type: object
      required: [length_m, height_m, weight_kg]
      properties: { length_m: { anyOf: [{ $ref: '#/components/schemas/Range' }, { type: 'null' }] }, height_m: { anyOf: [{ $ref: '#/components/schemas/Range' }, { type: 'null' }] }, weight_kg: { anyOf: [{ $ref: '#/components/schemas/Range' }, { type: 'null' }] } }
    SpeciesPeriod: { type: object, required: [id, name, era], properties: { id: { $ref: '#/components/schemas/Slug' }, name: { type: string }, era: { $ref: '#/components/schemas/Summary' } } }
    Species:
      type: object
      required: [id, name, scientific_name, diet, description, discovery_year, image_url, size, taxonomy, periods, continents, countries]
      properties:
        id: { $ref: '#/components/schemas/Slug' }
        name: { type: string, description: Common name; not unique. }
        scientific_name: { type: string }
        diet: { $ref: '#/components/schemas/Diet' }
        description: { type: string }
        discovery_year: { type: [integer, 'null'] }
        image_url: { type: [string, 'null'] }
        size: { anyOf: [{ $ref: '#/components/schemas/Size' }, { type: 'null' }] }
        taxonomy:
          type: object
          description: Full lineage, derived from the genus.
          required: [domain, kingdom, phylum, class, order, family, genus]
          properties: { domain: { $ref: '#/components/schemas/Summary' }, kingdom: { $ref: '#/components/schemas/Summary' }, phylum: { $ref: '#/components/schemas/Summary' }, class: { $ref: '#/components/schemas/Summary' }, order: { $ref: '#/components/schemas/Summary' }, family: { $ref: '#/components/schemas/Summary' }, genus: { $ref: '#/components/schemas/Summary' } }
        periods: { type: array, description: Oldest first., items: { $ref: '#/components/schemas/SpeciesPeriod' } }
        continents: { type: array, description: 'Prehistoric first, then by name.', items:{ $ref: '#/components/schemas/ContinentSummary' } }
        countries: { type: array, description: Sorted by name., items: { $ref: '#/components/schemas/Summary' } }
      example:
        id: tyrannosaurus-rex
        name: Tyrannosaurus
        scientific_name: Tyrannosaurus rex
        diet: carnivore
        description: Large theropod from the Late Cretaceous of western North America.
        discovery_year: 1905
        image_url: https://example.org/trex.png
        size: { length_m: { min: 11, max: 12.3 }, height_m: null, weight_kg: { min: 5000, max: 8000 } }
        taxonomy:
          domain: { id: eukaryota, name: Eukaryota }
          kingdom: { id: animalia, name: Animalia }
          phylum: { id: chordata, name: Chordata }
          class: { id: reptilia, name: Reptilia }
          order: { id: saurischia, name: Saurischia }
          family: { id: tyrannosauridae, name: Tyrannosauridae }
          genus: { id: tyrannosaurus, name: Tyrannosaurus }
        periods: [{ id: cretaceous, name: Cretaceous, era: { id: mesozoic, name: Mesozoic } }]
        continents: [{ id: laramidia, name: Laramidia, type: prehistoric }, { id: north-america, name: North America, type: modern }]
        countries: [{ id: canada, name: Canada }, { id: usa, name: United States }]
    SpeciesCreate:
      type: object
      additionalProperties: false
      required: [id, name, scientific_name, diet, description, genus_id, period_ids]
      properties:
        id: { $ref: '#/components/schemas/Slug' }
        name: { $ref: '#/components/schemas/Name' }
        scientific_name: { type: string, minLength: 1, maxLength: 128, description: 'Unique, compared ignoring case.' }
        diet: { $ref: '#/components/schemas/Diet' }
        description: { type: string, minLength: 1, maxLength: 1000 }
        genus_id: { $ref: '#/components/schemas/Slug' }
        period_ids: { type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: { $ref: '#/components/schemas/Slug' } }
        continent_ids: { type: [array, 'null'], maxItems: 20, uniqueItems: true, items: { $ref: '#/components/schemas/Slug' }, description: Prehistoric and modern allowed; null or omitted means none. }
        country_ids: { type: [array, 'null'], maxItems: 50, uniqueItems: true, items: { $ref: '#/components/schemas/Slug' }, description: Countries where fossils were found; independent of continent_ids. }
        size: { anyOf: [{ $ref: '#/components/schemas/SizeInput' }, { type: 'null' }] }
        discovery_year: { type: [integer, 'null'], minimum: 1600, description: Up to the current year (UTC). }
        image_url: { type: [string, 'null'], maxLength: 2048, pattern: '^[Hh][Tt][Tt][Pp][Ss]?://[^/?#]', description: Absolute http or https URL. }
      example:
        id: tyrannosaurus-rex
        name: Tyrannosaurus
        scientific_name: Tyrannosaurus rex
        diet: carnivore
        description: Large theropod from the Late Cretaceous of western North America.
        genus_id: tyrannosaurus
        period_ids: [cretaceous]
        continent_ids: [laramidia, north-america]
        country_ids: [canada, usa]
        size: { length_m: { min: 11.0, max: 12.3 }, weight_kg: { min: 5000, max: 8000 } }
        discovery_year: 1905
        image_url: https://example.org/trex.png
    SpeciesPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Same field rules as SpeciesCreate; `id` is not allowed. `period_ids` cannot be null or empty.
      properties:
        name: { $ref: '#/components/schemas/Name' }
        scientific_name: { type: string, minLength: 1, maxLength: 128 }
        diet: { $ref: '#/components/schemas/Diet' }
        description: { type: string, minLength: 1, maxLength: 1000 }
        genus_id: { $ref: '#/components/schemas/Slug' }
        period_ids: { type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: { $ref: '#/components/schemas/Slug' } }
        continent_ids: { type: [array, 'null'], maxItems: 20, uniqueItems: true, items: { $ref: '#/components/schemas/Slug' } }
        country_ids: { type: [array, 'null'], maxItems: 50, uniqueItems: true, items: { $ref: '#/components/schemas/Slug' } }
        size: { anyOf: [{ $ref: '#/components/schemas/SizeInput' }, { type: 'null' }] }
        discovery_year: { type: [integer, 'null'], minimum: 1600 }
        image_url: { type: [string, 'null'], maxLength: 2048, pattern: '^[Hh][Tt][Tt][Pp][Ss]?://[^/?#]' }

